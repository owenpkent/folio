version: 2
updates:
  # Frontend npm dependencies. Minor + patch bumps are grouped into a single
  # monthly PR (always installs cleanly). Major bumps are intentionally left
  # ungrouped so Dependabot opens each as its own PR: breaking upgrades (e.g.
  # pdfjs-dist, react, eslint) must be reviewed and migrated individually, not
  # batched into one unmergeable PR.
  #
  # The exceptions below are *cohorts*: packages whose peer ranges pin them to
  # each other, so a PR bumping one alone cannot even `npm ci`, let alone tell
  # us anything about whether the upgrade works. react-dom@19 peers on
  # react@^19 and @types/react-dom@19 peers on @types/react@^19, so splitting
  # them produced two permanently red PRs (#20, #21) that said nothing about
  # React 19; @eslint/js@10 peers on eslint@^10 the same way (#22). Grouping the
  # cohort keeps one dedicated, reviewable PR per breaking upgrade -- the intent
  # above -- while making that PR installable.
  #
  # Adding a cohort is NOT the fix for every install failure. An `ERESOLVE` at
  # `npm ci` has two causes that print the same error: a cohort member left
  # behind when a compatible release exists (fix it here), or upstream not
  # having shipped support at all, where no group change helps and the PR simply
  # waits. #47 is the second kind -- `eslint-plugin-*` below already matches
  # eslint-plugin-jsx-a11y, which has no eslint 10 release to move to. Check
  # `npm view <pkg> peerDependencies` before editing this file. See the
  # Dependabot section of CONTRIBUTING.md.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      react-major:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"
      eslint-major:
        applies-to: version-updates
        patterns:
          - eslint
          - "@eslint/*"
          - typescript-eslint
          - "eslint-plugin-*"
        update-types:
          - "major"
      # Demonstrated by #50 and #51, the same half-bump as #20/#21 in a cohort the
      # first pass missed: @vitejs/plugin-react@6 peers on vite@^8 while
      # plugin-react@4 caps at vite@7, so neither package can cross a major on its
      # own and both PRs failed at `npm ci`.
      vite-major:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/*"
        update-types:
          - "major"
      # Preventive rather than demonstrated: @vitest/coverage-v8 peers on the exact
      # vitest version, so a vitest major has the identical problem the moment one
      # is published. Grouped now while the reasoning is in front of us, rather
      # than after another pair of permanently red PRs.
      vitest-major:
        applies-to: version-updates
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - "major"
      npm-minor:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: chore
      include: scope

  # Rust / Cargo dependencies for the Tauri backend.
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
