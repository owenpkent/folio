name: Fuzz

# Coverage-guided fuzzing (Jazzer.js) of the parsers that read files the user did
# not write. See docs/testing.md#coverage-guided-fuzzing-jazzerjs. The fast-check
# property tests stay in ci.yml. This is not a PR gate: it is open-ended by
# nature, so it runs nightly and reports through issues instead of failing PRs.
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to fuzz each target
        type: number
        default: 10

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Expressions have no arithmetic, so this is a ceiling rather than the budget
    # plus a margin. The budget itself is capped to fit under it in the Fuzz step.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [p12, signatures, content-stream, addresses, combine-pdf]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The evolved corpus is the point of running nightly: each run starts from
      # the last one's coverage. Every run saves under a fresh key, and restores
      # the newest one for this target.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/.corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        # Explicit, so the step runs with pipefail and a crash fails it through tee.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MINUTES: ${{ inputs.minutes || 10 }}
        run: |
          minutes=$(( MINUTES > 60 ? 60 : MINUTES ))
          export FUZZ_SECONDS=$(( minutes * 60 ))
          mkdir -p "fuzz/crashes/$TARGET"
          npm run fuzz -- "$TARGET" 2>&1 | tee "fuzz/crashes/$TARGET/fuzz.log"

      # Save even when the fuzzer found a crash, so the run's coverage is kept.
      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/.corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # The whole fuzz/crashes folder, which in this job holds only this target's
      # subfolder, so the artifact's files are <target>/fuzz.log, <target>/crash-*.
      # The report job relies on that layout.
      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/crashes
          if-no-files-found: ignore

  # Kept apart from the job that runs the fuzzer so that job never holds a token
  # that can write issues.
  report:
    name: Report crashes
    needs: fuzz
    if: always() && needs.fuzz.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # merge-multiple, because without it the action's layout depends on how
      # many artifacts match: several each get a folder named after the
      # artifact, but a single one is unpacked straight into `path`. Merged,
      # the result is crashes/<target>/ whether one target failed or all five.
      - name: Download crash artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-crash-*
          path: crashes
          merge-multiple: true

      - name: Open or update issues
        run: |
          shopt -s nullglob
          # Anything directly in crashes/ means the layout above did not hold.
          # Stop loudly: carrying on would skip a crash without a word.
          for entry in crashes/*; do
            if [ ! -d "$entry" ]; then
              echo "::error::unexpected file $entry: expected crashes/<target>/ folders only"
              exit 1
            fi
          done
          reported=0
          for dir in crashes/*/; do
            dir="${dir%/}"
            target="${dir##*/}"
            if [[ ! "$target" =~ ^[a-z0-9-]+$ ]] || [ ! -f "$dir/fuzz.log" ]; then
              echo "::error::unexpected artifact folder $dir: expected crashes/<target>/fuzz.log"
              exit 1
            fi
            inputs=("$dir"/crash-* "$dir"/oom-* "$dir"/timeout-* "$dir"/slow-unit-*)
            title="Fuzz crash: $target"
            {
              if [ ${#inputs[@]} -gt 0 ]; then
                first="${inputs[0]}"
                echo "The nightly fuzz run found an input that makes the \`$target\` target fail."
                echo
                echo "Run: $RUN_URL (artifact \`fuzz-crash-$target\`, file \`$(basename "$first")\`)"
                echo
                echo "Input ($(wc -c < "$first") bytes, base64; large inputs are in the artifact only):"
                echo '```'
                if [ "$(wc -c < "$first")" -le 4000 ]; then base64 -w 76 "$first"; else echo "(see artifact)"; fi
                echo '```'
              else
                # Failed without leaving an input: the target did not build, or
                # the fuzzer never started. Until that is fixed the target is
                # not being fuzzed at all, so it is reported like a crash.
                echo "The nightly fuzz run failed for the \`$target\` target without a crashing input, so the target did not build or the fuzzer never started. It is not being fuzzed until this is fixed."
                echo
                echo "Run: $RUN_URL (artifact \`fuzz-crash-$target\`)"
              fi
              echo
              echo "End of the fuzzer log:"
              echo '```'
              tail -n 40 "$dir/fuzz.log"
              echo '```'
            } > body.md
            number=$(gh issue list --state open --search "\"$title\" in:title" \
              --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file body.md
            else
              gh issue create --title "$title" --body-file body.md
            fi
            reported=$((reported + 1))
          done
          if [ "$reported" -eq 0 ]; then
            # The fuzz job failed before any target wrote a log (checkout or
            # install). The failed job says why; there is nothing to file.
            echo "::warning::the fuzz job failed but no target uploaded a log; see the failed job in this run"
          fi
