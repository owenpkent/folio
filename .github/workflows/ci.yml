name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly, for the long unseeded fuzz run in the `fuzz` job below. Every other
  # job opts out of this trigger.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# Cancel in-progress runs for the same ref to save CI minutes. Keyed on the event
# too, so the nightly run does not cancel a push build of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: lint, typecheck, and unit tests on Ubuntu across Node 20 & 22.
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    # The nightly schedule exists for the fuzz job only.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fail if the `tauri` crate and `@tauri-apps/api` drift in major.minor,
      # which can silently break cross-window IPC (see scripts/check-tauri-versions.mjs).
      - name: Check Tauri version parity
        run: npm run check:versions

      - name: Unit tests
        run: npm run test

  # Property/fuzz tests over the parsers a hostile document reaches on open.
  # Two shapes out of the same files (the settings live in src/test/setup.ts):
  # a short seeded pass that gates every PR, and a long unseeded one nightly.
  fuzz:
    name: Property tests (fuzz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fixed seed, low iteration count. A merge gate has to be reproducible and
      # quick: the same inputs every time, and a failure replays locally with
      # the same two variables.
      - name: Fuzz smoke (seeded)
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: npm run test:fuzz
        env:
          FC_NUM_RUNS: 500
          FC_SEED: 20260101

      # No seed: the point of the nightly is to reach inputs the seeded pass
      # never does. FC_NUM_RUNS defaults to 20000 in scripts/run-fuzz.mjs.
      - name: Fuzz (unseeded, 20k iterations)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:fuzz

  # Browser end-to-end smoke tests: open, render, fill a form, and digitally sign.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      # The same suite against `vite preview`, i.e. a real `npm run build`.
      #
      # The dev server ships each module roughly as authored, so nothing above
      # this line exercises the bundler or its minifier. That gap shipped a real
      # bug: the Vite 8 bump (#62) broke digital signing outright, because
      # rolldown and esbuild disagree about what a default import of a CommonJS
      # module means, and it was caught by luck rather than by design.
      #
      # Runs even when the step above failed, because the pair is the diagnosis:
      # dev green + preview red means bundling, both red means the app.
      - name: Run e2e tests against the production build
        if: ${{ !cancelled() }}
        run: npm run test:e2e:preview

      # Measure how far a saved copy sits from PDF/UA-1, which Section 508
      # 504.2.2 asks an authoring tool to be capable of exporting.
      #
      # Informational on purpose. PDF/UA export is a known "Does Not Support"
      # (docs/508-conformance.md): no JS library can author a structure tree into
      # an existing PDF, so this WILL report failures and must never block the
      # build. It exists so the gap is a tracked number rather than a guess, and
      # so a regression on the parts we do satisfy (/Contents on annotations,
      # Tabs=S on annotated pages) shows up in the report.
      #
      # veraPDF implements only the machine-checkable subset of PDF/UA — a clean
      # run would still say nothing about reading order, which is human-judged.
      - name: Measure PDF/UA-1 conformance of exports (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p test-results/exports pdfua-report
          if [ -z "$(ls -A test-results/exports)" ]; then
            echo "No exports were produced; skipping." | tee pdfua-report/report.txt
            exit 0
          fi
          docker run --rm \
            -v "${{ github.workspace }}/test-results/exports:/data:ro" \
            verapdf/cli@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb \
            --flavour ua1 --format text -r /data \
            | tee pdfua-report/report.txt

      - name: Upload PDF/UA report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdfua-report
          path: pdfua-report/
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Separate artifact, not a second copy: the two runs write different
      # reports, and the page snapshot in this one is what makes a bundling
      # failure legible. The signing bug reached the log only as a download that
      # never arrived, because the app catches the error into a toast.
      - name: Upload Playwright report (production build)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-preview
          path: playwright-report-preview/
          retention-days: 7

  # Debug Tauri build across all three desktop platforms to catch breakage.
  build:
    name: Tauri debug build (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # --no-bundle: compile-only smoke test across all three desktop OSes.
      # Bundling is skipped in CI because the installer needs the EV cert +
      # updater signing key, which live only on the release host.
      - name: Tauri debug build (no bundle)
        run: npm run tauri -- build --debug --no-bundle
