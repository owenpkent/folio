name: Dependabot auto-merge

# Queues Dependabot's patch and minor updates to squash-merge once every
# required check on main has passed. Left for a person: any semver-major bump,
# and any PR that touches a Tauri package (see the step below). The pattern is
# GitHub's own:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
on: pull_request

# Nothing by default; the one job below asks for exactly what it uses.
permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Two conditions, and each closes a different door. The PR was opened by
    # Dependabot, which is a property of the PR itself and not of whoever
    # caused this run. And this repository, so a fork never runs it.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'owenpkent/folio'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Whose commit is at the head of the branch decides which way this run
      # goes, not who triggered it: github.actor can be spoofed, but a commit
      # authored by dependabot[bot] and signed by GitHub cannot be faked by a
      # person. A Dependabot head (the PR opening, or a rebase/recreate) may be
      # queued. Any other head is a person pushing onto the branch, and that
      # takes the PR over.
      - name: Decide whether Dependabot still owns the branch
        id: head
        run: |
          read -r author verified < <(gh api "repos/$REPO/commits/$SHA" \
            --jq '[.author.login, .commit.verification.verified] | @tsv')
          if [ "$author" = 'dependabot[bot]' ] && [ "$verified" = true ]; then
            echo "dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "dependabot=false" >> "$GITHUB_OUTPUT"
            echo "Head $SHA was authored by $author; leaving the PR to a person."
          fi
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub only cancels a queued auto-merge by itself when the pusher lacks
      # write access, so a maintainer's push would otherwise be merged along
      # with Dependabot's once the checks go green. Un-queue it explicitly.
      - name: Hand the PR back to a person
        if: steps.head.outputs.dependabot == 'false'
        run: |
          queued="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$queued" = true ]; then
            gh pr merge --disable-auto "$PR_URL"
            echo "Auto-merge disabled."
          else
            echo "Nothing was queued."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No checkout. This job never runs the pull request's code; it reads
      # Dependabot's metadata and asks GitHub to merge later.
      - name: Read what Dependabot is updating
        if: steps.head.outputs.dependabot == 'true'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Tauri versions must move in lockstep across npm (@tauri-apps/*) and
      # cargo (tauri, tauri-build, tauri-plugin-*), and those bumps are
      # combined by hand into one PR (see .github/dependabot.yml). A PR that
      # touches any of them is never queued, whatever its semver level.
      # dependency-names is a comma-separated list, so a grouped PR carrying
      # one Tauri package among others is left for a person as a whole. The
      # 'tauri' substring already matches '@tauri-apps/'.
      #
      # update-type is the highest semver change in the PR, so a grouped PR
      # carrying one major bump is also left for a person as a whole.
      #
      # main requires no approving review, only the status checks, so no
      # approve step is needed: --auto waits for those checks and merges.
      - name: Queue the update to merge when checks pass
        if: >-
          steps.head.outputs.dependabot == 'true' &&
          !contains(steps.metadata.outputs.dependency-names, 'tauri') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.package-ecosystem == 'github_actions')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
